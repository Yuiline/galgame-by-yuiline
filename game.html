<!DOCTYPE html>
<!-- ============================================================
     游戏名: 剧情对话小游戏
     文件:   game.html
     说明:   第 1 章 — 林韦在街角炒饭摊偶遇初恋思博雅,
             在城市夜晚的桥上, 扑通一声落入河中。
     资源:
       图片   - 素材1.png / 素材2.png (背景)
              - ss.png / ss-sad.png   (人物立绘)
              - back.png              (返回按钮)
       音频   - urban_acid_jazz_vn_bgm.mp3   (爵士背景乐)
              - water_fall_sound.mp3         (河水声)
              - crowd_sound.mp3             (人群嘈杂)
              - fried_rice_sound.mp3         (炒饭声)
              - high_heels_sound.mp3        (高跟鞋声)
     ============================================================ -->

<html lang="zh-CN">
<head>
    <!-- 字符编码: UTF-8 支持中文显示 -->
    <meta charset="UTF-8">

    <!-- 视口设置: 移动端也能正确缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 网页标题: 显示在浏览器标签页上 -->
    <title>剧情对话小游戏</title>

    <!-- ========================== 样式区 (CSS) ========================== -->
    <style>
        /* ---------- 全局重置 ----------
           消除浏览器默认的内外边距, 避免出现意外间距 */
        * { margin: 0; padding: 0; }

        /* ---------- 页面主体 ----------
           - position: relative   作为子元素的定位参照
           - min-height: 100vh    高度至少撑满一整屏
           - overflow: hidden     防止溢出出现滚动条
           - cursor: pointer      提示"可点击推进剧情"
           - background-color:    背景图加载失败时的兜底深色 */
        body {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            cursor: pointer;
            background-color: #222;
        }

        /* ---------- 全屏背景图容器 ----------
           absolute + 四向 0  铺满整个视口
           background-size: cover    等比缩放并裁剪填满
           background-position       始终居中 */
        .game-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url(素材1.png);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* ---------- 分隔线 (对话框发光条) ----------
           距底部 80px, 位于剧情文字上方
           透明 → 蓝色 → 透明 渐变, 柔和发光效果
           pointer-events: none  防止遮挡下方的点击事件 */
        hr.underline {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            border: none;
            height: 5px;
            background: linear-gradient(
                to right,
                transparent,
                rgba(32, 152, 237, 0.47),
                transparent
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ---------- 剧情文字框 ----------
           固定在屏幕下方, 水平居中
           半透明深色底 + 阴影: 无论背景明暗, 白字都清晰 */
        .story-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            padding: 16px 24px;
            box-sizing: border-box;
            color: white;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            user-select: none;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1;
        }

        /* ---------- 返回按钮 ---------- */
        #back {
            position: absolute;
            top: 925px;
            left: 190px;
            width: 200px;
            height: 120px;
            cursor: pointer;
            z-index: 2;
            background: transparent;
            border: none;
        }

        /* ---------- 人物立绘 (通用样式) ----------
           默认 opacity: 0 不可见, 加 .show 类后 1.2 秒淡入
           position: absolute 定位在屏幕中间偏上, 不挡剧情文字 */
        #ss,
        #ss-sad {
            position: absolute;
            left: 50%;
            transform: translate(-50%);
            max-width: 60vh;
            max-height: 60vh;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            filter: blur(0px);
            bottom: 0;
            transition: opacity 1.2s ease-in-out;
        }

        /* .show   = 显示立绘  (opacity: 1)
           .delete = 移除立绘  (opacity: 0) */
        #ss.show,
        #ss-sad.show {
            opacity: 1;
        }
        #ss-sad.delete {
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- ====== 背景图层 ====== -->
    <div id="game-bg" class="game-body"></div>

    <!-- ====== 分隔线 (对话框发光效果) ====== -->
    <hr class="underline">

    <!-- ====== 剧情文本容器 ======
         id="story-text" 用于 JS 获取并修改内容 -->
    <div id="story-text" class="story-text"></div>

    <!-- ====== 人物立绘 ======
         默认透明, 由 JS 添加/移除 .show / .delete 类触发淡入淡出 -->
    <img src="ss.png"     alt="ss"     id="ss">
    <img src="ss-sad.png" alt="ss-sad" id="ss-sad">

    <!-- ====== 返回按钮 ====== -->
    <img src="back.png" alt="返回" id="back">

    <!-- ====== 音频元素 ======
         所有音频在页面加载时即预加载 (preload="auto")
         BGM 必须有 loop; 短音效不需要 loop */
         浏览器策略: 首次 play() 必须发生在用户交互之后 -->
    <audio src="urban_acid_jazz_vn_bgm.mp3" id="bgm"        loop preload="auto"></audio>
    <audio src="water_fall_sound.mp3"       id="bgmwater"   preload="auto"></audio>
    <audio src="crowd_sound.mp3"            id="bgmcrowd"   preload="auto"></audio>
    <audio src="fried_rice_sound.mp3"       id="bgmrice"    preload="auto"></audio>
    <audio src="high_heels_sound.mp3"       id="bgmheels"   preload="auto"></audio>

    <!-- ========================== 脚本区 (JS) ==========================
         放在 body 末尾, 确保 DOM 已构建完毕 -->
    <script>
    'use strict';

    // ============================================================
    // 1. 数据
    // ============================================================

    /** 剧情文本数组 — 想新增对话直接往这里加字符串 */
    const lines = [
        "六月的傍晚，热气还没散尽。",
        "铁锅与铲子碰撞的声音，在街角重复了一整天。",
        "林韦站在摊子后面，机械地翻动着锅里的米粒",
        "油光、葱花、鸡蛋，混在一起，冒着白烟。",
        "他的手很稳，心却很空。",
        "（大学毕业三个月了。）",
        "（投出去的简历，像扔进河里的石子，连个响都没有。）",
        "（现在每天站在这里，帮我爸卖炒饭。）",
        "父亲：发什么呆？火候大了！",
        "林韦：……知道了。",
        "他低下头，继续翻炒。",
        "锅里的饭粒跳动着，像在嘲笑他。",
        "就在这时，摊子前停下了一个人。",
        "他没抬头，习惯性地开口。",
        "林韦：吃什么",
        "话说到一半，他抬起了头。",
        "然后，愣住了。",
        "站在摊前的，是一个穿着浅色连衣裙的女生。",
        "长发，安静，眼睛很亮。",
        "那张脸，他认得。",
        "林韦：……思博雅？",
        "思博雅：……林韦",
        "她轻轻叫了他的名字。",
        "声音和记忆里一样，只是多了点说不清的东西。",
        "空气安静了几秒。",
        "只有锅里的油还在滋滋作响。",
        "思博雅：好久不见。",
        "林韦：嗯……好久不见。",
        "他想说点什么。",
        "想问她这些年去哪了，想问她怎么找到这里的，想问她……还记不记得小时候的事。",
        "但最后，什么都没说出口。",
        "思博雅的目光，从他脸上，移到了他身后的摊子。",
        "移到了那口油腻的铁锅上。",
        "移到了他被油烟熏得发黄的手上。",
        "她的眼神，变了。",
        "不是嫌弃。",
        "是……心疼。",
        "思博雅：你……一直在这里吗？",
        "林韦：嗯。毕业了，没找到工作，就先帮我爸。",
        "他笑了一下，想装得轻松点。",
        "但那个笑，连他自己都觉得难看。",
        "思博雅没有笑。",
        "她看着他，看了很久。",
        "思博雅：……",
        "思博雅：你要好好的。",
        "说完这句话，她转过身，走了。",
        "没有买炒饭。",
        "没有留联系方式。",
        "只是走了。",
        "林韦站在原地，看着她的背影，一点一点消失在街角。",
        "手里的铲子，还举在半空。",
        "林韦（内心）：（……她走了。）",
        "林韦（内心）：（她看了看我，然后走了。）",
        "林韦（内心）：（她是不是觉得……我很可怜？）",
        "锅里的饭，糊了。",
        "父亲骂了他一句，他没听见。",
        "那天晚上，摊子收得很早。",
        "林韦没回家。",
        "他一个人，在街上闲逛。",
        "城市的灯很亮。",
        "但没有一盏，是为他亮的。",
        "他走到了一座桥上。",
        "桥下是河，黑漆漆的，看不见底。",
        "林韦（内心）：（我到底在干什么啊。）",
        "林韦（内心）：（读了四年大学，最后站在这里卖炒饭。）",
        "林韦（内心）：（连她……都用那种眼神看我。）",
        "他靠在栏杆上，仰起头。",
        "天上没有星星。",
        "林韦：真没意思。",
        "他往后退了一步。",
        "脚下一滑。",
        "栏杆很低。",
        "夜很黑。",
        "扑通——",
        "河水很凉。",
        "凉得刺骨。",
        "他挣扎了几下，然后，什么都不知道了。",
        "——"
    ];

    /** 当前对话索引 (0 = 第一句) */
    let i = 0;

    // ============================================================
    // 2. 工具函数
    // ============================================================

    /**
     * 让音频音量在指定时间内平滑过渡
     * @param {HTMLAudioElement} audio    音频元素
     * @param {number}           fromV    起始音量 (0 ~ 1)
     * @param {number}           toV      目标音量 (0 ~ 1)
     * @param {number}           duration 过渡秒数
     */
    function fadeVolume(audio, fromV, toV, duration) {
        const steps = duration * 1000 / 50;       // 总步数 (50ms 一帧)
        const stepChange = (toV - fromV) / steps; // 每帧变化量
        let currentV = fromV;
        let count = 0;

        const timer = setInterval(function () {
            currentV += stepChange;
            count++;

            // 防止音量超过 [0, 1] 范围
            if (currentV < 0) currentV = 0;
            if (currentV > 1) currentV = 1;
            audio.volume = currentV;

            // 达到目标: 停止定时器, 修正最终值
            if (count >= steps) {
                clearInterval(timer);
                audio.volume = toV;
                if (toV === 0) audio.pause(); // 淡出到 0 顺便暂停, 节省资源
            }
        }, 50);
    }

    // ============================================================
    // 3. 主逻辑 — 推进到下一句
    // ============================================================

    /** 获取常用 DOM 元素 (缓存, 避免反复查询) */
    const storyText   = document.getElementById('story-text');
    const gameBg      = document.getElementById('game-bg');
    const imgSs       = document.getElementById('ss');
    const imgSsSad    = document.getElementById('ss-sad');
    const audioBgm    = document.getElementById('bgm');
    const audioWater  = document.getElementById('bgmwater');
    const audioCrowd  = document.getElementById('bgmcrowd');
    const audioRice   = document.getElementById('bgmrice');
    const audioHeels  = document.getElementById('bgmheels');

    /**
     * 推进到下一句台词, 并处理对应剧情效果
     * (图片切换、淡入淡出、声音播放)
     */
    function nextLine() {
        i++;
        if (i >= lines.length) {
            window.location.href = "game2.html"; // 跳转到第 2 章
            return;
        }

        // ---------- 背景切换 ----------
        // 第 56 句 (思博雅转身离开) 时: 背景图 素材1 → 素材2
        if (i === 56) {
            gameBg.style.backgroundImage = "url('素材2.png')";
        }

        // ---------- 人物立绘 ----------
        // 第 17 句 (林韦认出对方) 时: ss.png 淡入
        if (i === 17)  imgSs.classList.add('show');
        // 第 34 句 (思博雅目光移开) 时: ss.png 淡出
        if (i === 34)  imgSs.classList.remove('show');
        // 第 35 句 (眼神变了) 时: ss-sad.png 淡入
        if (i === 35)  imgSsSad.classList.add('show');
        // 第 47 句 (思博雅转身离开) 时: ss-sad.png 淡出
        if (i === 47)  imgSsSad.classList.add('delete');

        // ---------- 声音 ----------
        // 第 1 句: 街角嘈杂的人声
        if (i === 1) {
            audioCrowd.volume = 0.3;
            audioCrowd.play();
        }
        // 第 2 句: 铁锅与铲子碰撞声
        if (i === 2) {
            audioRice.volume = 0.3;
            audioRice.play();
        }
        // 第 3 句: 机械翻炒炒饭声
        if (i === 3) {
            audioRice.currentTime = 0;
            audioRice.play();
        }
        
        
        // 第 73 句 ("扑通——", 跳入河水): BGM 淡出 + 河水声淡入
        if (i === 73) {
            audioWater.volume = 0;                    // 先静音
            audioWater.play();                        // 开始播放
            fadeVolume(audioWater, 0, 0.5, 1.5);      // 1.5s 淡入到 50%
            fadeVolume(audioBgm, audioBgm.volume, 0, 1.5); // 1.5s 淡出到 0
        }

        // ---------- 更新文本 ----------
        storyText.textContent = lines[i];
    }

    // ============================================================
    // 4. 初始化
    // ============================================================

    // 把第一句填进文本框
    storyText.textContent = lines[i];

    // ============================================================
    // 5. 事件绑定
    // ============================================================

    /** 点击屏幕任意位置 → 推进剧情 + 首次播放 BGM */
    document.addEventListener('click', function () {
        // 第一次点击时启动 BGM (浏览器自动播放策略要求)
        if (audioBgm.paused) {
            audioBgm.volume = 0.3;
            audioBgm.play();
        }
        // 推进剧情
        nextLine();
    });

    /** 键盘: 空格 / 回车 也可推进剧情 */
    document.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();   // 阻止空格默认滚动
            nextLine();
        }
    });

    /** 返回按钮 → 回到首页 */
    document.getElementById('back').addEventListener('click', function (e) {
        e.stopPropagation();      // 阻止冒泡触发上方推进剧情
        window.location.href = "index.html";
    });

    </script>
</body>
</html>
