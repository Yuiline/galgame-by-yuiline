<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉小说 - 标题画面</title>
    <style>
        .center-box{display: flex;
            justify-content: center;
        }
        .start-button{display: flex;
            justify-content: center;
            margin-top: 400px;
        }



    </style>
    <!-- 从外部 game.js 文件加载脚本（推荐写法） -->
    <script src="game.js"></script>
</head>
<body>
    <div class="center-box">
        <h2 class="title">这是一个galgame的名字</h2>
    </div>
    <div class="center-box">
        <!-- onclick 点击时调用 startGame 函数 -->
        <button class="start-button" onclick="startGame()">开始游戏</button>
    </div>
</body>
</html>
